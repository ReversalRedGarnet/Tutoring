<!-- The mark is the prerequisite graph itself: three nodes and the edge
     running through them. Same idea as the ladder rail on a topic. -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <symbol id="mark" viewBox="0 0 28 28">
    <path d="M6 21 L14 14 L22 7" fill="none" stroke="currentColor"
          stroke-width="1.6" opacity=".6"/>
    <rect x="2.5"  y="17.5" width="7" height="7" fill="currentColor" opacity=".45"/>
    <rect x="10.5" y="10.5" width="7" height="7" fill="currentColor" opacity=".7"/>
    <rect x="18.5" y="3.5"  width="7" height="7" fill="currentColor"/>
  </symbol>
</svg>

<header class="topbar" id="topbar">
  <a class="brand" href="#/">
    <svg class="brand-mark" aria-hidden="true"><use href="#mark"/></svg>
    <span class="brand-text">study<span class="brand-caret">_</span></span>
  </a>
  <nav class="topnav" id="topnav"></nav>
  <div class="topbar-rule" aria-hidden="true"></div>
</header>

<main class="stage">
  <div id="view" class="page" tabindex="-1"></div>
</main>

<footer class="foot">
  <div class="foot-trace" aria-hidden="true"></div>
  <div class="foot-inner">

    <div class="foot-brand">
      <svg class="foot-mark" aria-hidden="true"><use href="#mark"/></svg>
      <p class="foot-tag">One idea at a time.</p>
    </div>

    <!-- Placeholder columns. Fill these in later. -->
    <nav class="foot-cols">
      <div class="foot-col">
        <p class="foot-head">Learning</p>
        <a href="#/map">Topic map</a>
        <a href="#/">Sign in</a>
      </div>
      <div class="foot-col">
        <p class="foot-head">For parents</p>
        <span class="foot-soon">Coming soon</span>
        <span class="foot-soon">Coming soon</span>
      </div>
      <div class="foot-col">
        <p class="foot-head">About</p>
        <span class="foot-soon">Coming soon</span>
        <span class="foot-soon">Coming soon</span>
      </div>
    </nav>

  </div>

  <p class="foot-note">Your work is saved on this computer only. Nothing is sent anywhere.</p>
</footer>
